<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">

      <a-box position="0 0.5 0" color="red"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
      </a-box>

      <a-sphere position="1 0.5 0" radius="0.5" color="blue">
      </a-sphere>

      <a-cylinder position="-1 0.5 0" radius="0.3" height="1" color="green">
      </a-cylinder>

      <a-text value="Abdulaziz Alsaiari"
              position="0 2 0"
              align="center"
              color="yellow"
              width="4"
              animation="property: position; to: 0 2.2 0; dir: alternate; loop: true; dur: 2000">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
